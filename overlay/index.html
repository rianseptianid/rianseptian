<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay</title>
  <link rel="stylesheet" href="/overlay/overlay.css?v=4" />
</head>

<body>
  <!-- Alert Container -->
  <div id="alertContainer" class="alert-container"></div>

  <!-- Join Notification -->
  <div id="joinBox" class="join-box"></div>

  <!-- Latest Chat -->
  <div id="latestChat" class="latest-chat"></div>

  <!-- Top Gift Board -->
  <div id="topGiftBoard" class="overlay-board top-gift-board" data-mode="compact">
    <div class="board-title">
      <svg class="overlay-title-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD700"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 21h8M12 17v4" />
        <path d="M7 4h10v6a5 5 0 0 1-10 0V4z" />
        <path d="M17 5h3v3a3 3 0 0 1-3 3" />
        <path d="M7 5H4v3a3 3 0 0 0 3 3" />
      </svg>
      <span>Top Gifter</span>
      <button class="board-toggle-btn" type="button" title="Perluas / Perkecil">▼</button>
    </div>
    <ol id="topGiftList" class="board-list"></ol>
  </div>

  <!-- Top Tap-Tap Board -->
  <div id="topLikeBoard" class="overlay-board top-like-board" data-mode="compact">
    <div class="board-title board-title-like">
      <svg class="overlay-title-icon like-title-heart" width="18" height="18" viewBox="0 0 24 24" fill="#FFD700"
        stroke="none">
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </svg>
      <span>Top Tap-Tap</span>
      <button class="board-toggle-btn" type="button" title="Perluas / Perkecil">▼</button>
    </div>
    <ol id="topLikeList" class="board-list"></ol>
  </div>

  <!-- Media Overlay (image/video) -->
  <div id="mediaOverlay" class="media-overlay">
    <img id="mediaImage" class="media-el" alt="" />
    <video id="mediaVideo" class="media-el" playsinline autoplay></video>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/overlay/overlay.js?v=4"></script>
</body>

</html>
