<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nurearn — battle arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       nurearn — battle arena overlay (a vs b)
       Supports Multi-Views, PC Mode, Flame Effects & Realtime Sync
       ============================================================ */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #FFD700;
      --gold-dark: #D4AF37;
      --gold-gradient: linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
      --gold-glow: rgba(255, 215, 0, 0.45);
      --gold-soft: rgba(255, 215, 0, 0.12);

      /* Team A (Default: Gold) */
      --team-a: #FFD700;
      --team-a-dark: #D4AF37;
      --team-a-gradient: linear-gradient(135deg, #FFE259 0%, #FF9900 100%);
      --team-a-glow: rgba(255, 215, 0, 0.5);

      /* Team B (Default: Red / Crimson) */
      --team-b: #FF3B3B;
      --team-b-dark: #C81E1E;
      --team-b-gradient: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
      --team-b-glow: rgba(255, 59, 59, 0.5);

      --bg-card: rgba(10, 12, 16, 0.88);
      --bg-card-border: rgba(255, 215, 0, 0.22);
      --border-soft: rgba(255, 255, 255, 0.08);

      --text-main: #FFFFFF;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      --font-heading: 'Poppins', 'Fredoka', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: var(--font-body);
      color: var(--text-main);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .battle-overlay {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    /* ==================== THEMES ==================== */
    body.bg-transparent .battle-header,
    body.bg-transparent .battle-arena,
    body.bg-transparent .leaderboard {
      background: rgba(0, 0, 0, 0.5) !important;
      backdrop-filter: blur(8px);
    }

    body.bg-cyber .battle-arena,
    body.bg-cyber .leaderboard {
      background: rgba(8, 10, 18, 0.95) !important;
      border: 1.5px solid #00F0FF !important;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25) !important;
      clip-path: polygon(0 10px, 10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px));
    }

    body.bg-solid .battle-header,
    body.bg-solid .battle-arena,
    body.bg-solid .leaderboard {
      background: #0d0f14 !important;
      backdrop-filter: none;
    }

    /* ==================== PC MODE ==================== */
    body.mode-pc .battle-overlay {
      max-width: 1100px;
      top: 28px;
      gap: 16px;
    }
    body.mode-pc .battle-header {
      padding: 12px 36px;
    }
    body.mode-pc .battle-header .header-text {
      font-size: 22px;
    }
    body.mode-pc .team-avatar,
    body.mode-pc .team-avatar-placeholder {
      width: 54px;
      height: 54px;
      font-size: 24px;
    }
    body.mode-pc .team-name {
      font-size: 18px;
      max-width: 260px;
    }
    body.mode-pc .team-score {
      font-size: 16px;
    }
    body.mode-pc .battle-bar {
      height: 32px;
    }
    body.mode-pc .vs-badge {
      font-size: 16px;
      padding: 4px 16px;
    }
    body.mode-pc .lb-item {
      padding: 7px 12px;
    }
    body.mode-pc .lb-name {
      font-size: 14px;
    }
    body.mode-pc .lb-avatar,
    body.mode-pc .lb-avatar-placeholder {
      width: 32px;
      height: 32px;
    }

    /* ==================== VIEWS FILTER ==================== */
    body.view-bar .battle-header,
    body.view-bar .leaderboards-row { display: none !important; }

    body.view-lba .battle-header,
    body.view-lba .battle-arena,
    body.view-lba #leaderboardB { display: none !important; }
    body.view-lba .leaderboards-row { grid-template-columns: 1fr !important; }

    body.view-lbb .battle-header,
    body.view-lbb .battle-arena,
    body.view-lbb #leaderboardA { display: none !important; }
    body.view-lbb .leaderboards-row { grid-template-columns: 1fr !important; }

    body.view-lb .battle-header,
    body.view-lb .battle-arena { display: none !important; }

    /* ==================== HEADER (VS TITLE) ==================== */
    .battle-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 22px;
      background: var(--bg-card);
      border: 1.5px solid var(--bg-card-border);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75), 0 0 20px var(--gold-glow);
      width: fit-content;
      margin: 0 auto;
    }

    .battle-header .vs-icon {
      font-size: 18px;
      filter: drop-shadow(0 0 8px var(--gold-glow));
    }

    .battle-header .header-text {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==================== BATTLE ARENA (MAIN BAR) ==================== */
    .battle-arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: var(--bg-card);
      border: 1.5px solid var(--bg-card-border);
      border-radius: 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 215, 0, 0.08);
      position: relative;
    }

    /* Team Cards */
    .team-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .team-card.team-a { align-items: flex-start; }
    .team-card.team-b { align-items: flex-end; }

    .team-header {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .team-b .team-header {
      flex-direction: row-reverse;
    }

    .team-avatar,
    .team-avatar-placeholder {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      border: 2px solid var(--team-a);
      box-shadow: 0 0 16px var(--team-a-glow);
      background: var(--gold-soft);
    }

    .team-b .team-avatar,
    .team-b .team-avatar-placeholder {
      border-color: var(--team-b);
      box-shadow: 0 0 16px var(--team-b-glow);
      background: rgba(255, 59, 59, 0.15);
    }

    .team-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .team-name {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 800;
      color: var(--team-a);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
      text-shadow: 0 0 10px var(--team-a-glow);
      letter-spacing: 0.3px;
    }

    .team-b .team-name {
      color: var(--team-b);
      text-shadow: 0 0 10px var(--team-b-glow);
      text-align: right;
    }

    .team-score {
      font-size: 13px;
      font-weight: 800;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .team-b .team-score {
      flex-direction: row-reverse;
    }

    .coin-icon {
      width: 14px;
      height: 14px;
      object-fit: contain;
      vertical-align: middle;
    }

    /* ==================== BATTLE PROGRESS BAR ==================== */
    .battle-bar-wrap {
      grid-column: 1 / -1;
      width: 100%;
      position: relative;
      margin-top: 2px;
    }

    .battle-bar {
      position: relative;
      width: 100%;
      height: 26px;
      background: #090B0E;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
    }

    .battle-fill-a {
      height: 100%;
      background: var(--team-a-gradient);
      border-radius: 13px 0 0 13px;
      transition: width 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 0 16px var(--team-a-glow), inset 0 1px 2px rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .battle-fill-b {
      height: 100%;
      background: var(--team-b-gradient);
      border-radius: 0 13px 13px 0;
      transition: width 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 0 16px var(--team-b-glow), inset 0 1px 2px rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
      margin-left: auto;
    }

    /* ==================== SPLIT BARS (SEPARATE A & B) ==================== */
    .battle-split-bars-wrap {
      grid-column: 1 / -1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .battle-split-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .battle-split-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
    }
    .battle-split-track {
      position: relative;
      width: 100%;
      height: 16px;
      background: #090B0E;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .battle-split-fill-a {
      height: 100%;
      background: var(--team-a-gradient);
      border-radius: 8px;
      transition: width 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 0 14px var(--team-a-glow), inset 0 1px 2px rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }
    .battle-split-fill-b {
      height: 100%;
      background: var(--team-b-gradient);
      border-radius: 8px;
      transition: width 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 0 14px var(--team-b-glow), inset 0 1px 2px rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* ==================== PROGRESS BAR THEMES ==================== */
    /* Liquid wave progress bar style */
    body.bar-liquid .battle-fill-a,
    body.bar-liquid .battle-split-fill-a {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%) !important;
      box-shadow: 0 0 20px rgba(79, 172, 254, 0.6) !important;
    }
    body.bar-liquid .battle-fill-b,
    body.bar-liquid .battle-split-fill-b {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%) !important;
      box-shadow: 0 0 20px rgba(250, 112, 154, 0.6) !important;
    }

    /* Cyber Neon Laser style */
    body.bar-neon .battle-fill-a,
    body.bar-neon .battle-split-fill-a {
      background: linear-gradient(90deg, #00F0FF 0%, #7000FF 100%) !important;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.8) !important;
    }
    body.bar-neon .battle-fill-b,
    body.bar-neon .battle-split-fill-b {
      background: linear-gradient(90deg, #FF0055 0%, #FFAA00 100%) !important;
      box-shadow: 0 0 24px rgba(255, 0, 85, 0.8) !important;
    }

    /* Obsidian Crystal Glass style */
    body.bar-crystal .battle-fill-a,
    body.bar-crystal .battle-split-fill-a {
      background: linear-gradient(135deg, #FFDF00 0%, #FFFFFF 50%, #D4AF37 100%) !important;
      box-shadow: 0 0 20px rgba(255, 223, 0, 0.7) !important;
    }
    body.bar-crystal .battle-fill-b,
    body.bar-crystal .battle-split-fill-b {
      background: linear-gradient(135deg, #FF1E56 0%, #FFFFFF 50%, #FFAC41 100%) !important;
      box-shadow: 0 0 20px rgba(255, 30, 86, 0.7) !important;
    }

    /* ==================== GLASSMORPHISM & ANIMATIONS ==================== */
    body.has-glass .battle-header,
    body.has-glass .battle-arena,
    body.has-glass .leaderboard {
      background: rgba(15, 23, 42, 0.5) !important;
      backdrop-filter: blur(18px) !important;
      -webkit-backdrop-filter: blur(18px) !important;
      border: 1.5px solid rgba(255, 255, 255, 0.18) !important;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 215, 0, 0.12) !important;
    }

    /* Gain Flash Pulse */
    @keyframes gainSparkleFlash {
      0% { transform: scale(1); filter: brightness(1); }
      35% { transform: scale(1.03); filter: brightness(1.6) drop-shadow(0 0 16px var(--gold)); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .gain-sparkle-active {
      animation: gainSparkleFlash 0.45s ease-out;
    }

    /* Shimmer streak on bars */
    .battle-fill-a::after,
    .battle-fill-b::after,
    .battle-split-fill-a::after,
    .battle-split-fill-b::after {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 80%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.1) 20%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0.1) 80%,
        transparent 100%
      );
      animation: shineStreak 3s infinite linear;
      pointer-events: none;
    }

    @keyframes shineStreak {
      0% { left: -120%; }
      40% { left: 140%; }
      100% { left: 140%; }
    }

    /* VS Badge */
    .vs-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 900;
      font-style: italic;
      color: #000000;
      background: var(--gold-gradient);
      border: 2px solid #000000;
      padding: 2px 12px;
      border-radius: 10px;
      letter-spacing: 1px;
      box-shadow: 0 0 20px var(--gold-glow), 0 4px 10px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      animation: vsPulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes vsPulse {
      0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 15px var(--gold-glow); }
      100% { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 25px var(--gold-glow); }
    }

    /* Winner Match Banner */
    .winner-banner {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 18px;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #000;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 13px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      z-index: 20;
      animation: vsPulse 1s infinite alternate;
    }

    /* ==================== LEADERBOARDS ROW ==================== */
    .leaderboards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .leaderboard {
      background: var(--bg-card);
      border: 1.5px solid var(--bg-card-border);
      border-radius: 14px;
      padding: 10px 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
      min-height: 160px;
    }

    .leaderboard.leaderboard-a { border-color: rgba(255, 215, 0, 0.3); }
    .leaderboard.leaderboard-b { border-color: rgba(255, 59, 59, 0.3); }

    .lb-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .leaderboard-b .lb-header {
      flex-direction: row-reverse;
    }

    .lb-title {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      flex: 1;
    }

    .leaderboard-a .lb-title {
      color: var(--team-a);
      text-shadow: 0 0 8px var(--team-a-glow);
    }

    .leaderboard-b .lb-title {
      color: var(--team-b);
      text-shadow: 0 0 8px var(--team-b-glow);
      text-align: right;
    }

    .lb-count {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .lb-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lb-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid transparent;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      animation: lbIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes lbIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .leaderboard-b .lb-item {
      flex-direction: row-reverse;
      animation: lbInB 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes lbInB {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .lb-rank {
      font-size: 12px;
      font-weight: 800;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
      color: var(--text-secondary);
    }

    .lb-item.rank-1 .lb-rank {
      font-size: 14px;
      filter: drop-shadow(0 0 6px var(--team-a-glow));
    }

    .leaderboard-b .lb-item.rank-1 .lb-rank {
      filter: drop-shadow(0 0 6px var(--team-b-glow));
    }

    .lb-avatar,
    .lb-avatar-placeholder {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
    }

    .lb-info {
      flex: 1;
      min-width: 0;
    }

    .leaderboard-b .lb-info {
      text-align: right;
    }

    .lb-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .lb-value {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .leaderboard-a .lb-value { color: var(--team-a); }
    .leaderboard-b .lb-value { color: var(--team-b); }

    .lb-empty {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 11px;
      font-style: italic;
    }

    /* ==================== FLAME EFFECT (TOP 1) ==================== */
    .lb-item.rank-1.has-flame {
      background: linear-gradient(90deg, rgba(255, 120, 0, 0.2) 0%, rgba(255, 215, 0, 0.1) 60%, rgba(0, 0, 0, 0.4) 100%) !important;
      border: 1px solid rgba(255, 165, 0, 0.6) !important;
      box-shadow: 0 0 15px rgba(255, 120, 0, 0.35) !important;
      position: relative;
    }

    .leaderboard-b .lb-item.rank-1.has-flame {
      background: linear-gradient(270deg, rgba(255, 59, 59, 0.25) 0%, rgba(255, 0, 100, 0.1) 60%, rgba(0, 0, 0, 0.4) 100%) !important;
      border: 1px solid rgba(255, 59, 59, 0.6) !important;
      box-shadow: 0 0 15px rgba(255, 59, 59, 0.35) !important;
    }

    .lb-item.rank-1.has-flame .lb-name {
      font-weight: 800 !important;
      background: linear-gradient(90deg, #FFF 0%, #FFD700 50%, #FF6B00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(255, 107, 0, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .lb-item.rank-1.has-flame .lb-name::after {
      content: ' 🔥';
      -webkit-text-fill-color: initial;
      animation: flameFlicker 1.2s ease-in-out infinite alternate;
      font-size: 12px;
    }

    @keyframes flameFlicker {
      0% { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 4px #FF6B00); }
      100% { transform: scale(1.15) rotate(3deg); filter: drop-shadow(0 0 10px #FFD700); }
    }

    .lb-item.rank-1.has-flame .lb-avatar {
      border: 1.5px solid #FF8C00 !important;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.8) !important;
    }

    /* Overtake flash */
    .lb-item.overtake-a {
      animation: overtakeA 1.2s ease-out;
    }
    .lb-item.overtake-b {
      animation: overtakeB 1.2s ease-out;
    }
    @keyframes overtakeA {
      0% { transform: scale(1); }
      30% { transform: scale(1.04) translateX(-4px); box-shadow: 0 0 18px var(--team-a-glow); background: rgba(255, 215, 0, 0.3); }
      100% { transform: scale(1) translateX(0); }
    }
    @keyframes overtakeB {
      0% { transform: scale(1); }
      30% { transform: scale(1.04) translateX(4px); box-shadow: 0 0 18px var(--team-b-glow); background: rgba(255, 59, 59, 0.3); }
      100% { transform: scale(1) translateX(0); }
    }

    /* Pulse animations on point score */
    .battle-arena.pulse-a { animation: pulseA 0.6s ease-out; }
    .battle-arena.pulse-b { animation: pulseB 0.6s ease-out; }

    @keyframes pulseA {
      0% { transform: scale(1); }
      50% { transform: scale(1.015); box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 40px var(--team-a-glow); }
      100% { transform: scale(1); }
    }
    @keyframes pulseB {
      0% { transform: scale(1); }
      50% { transform: scale(1.015); box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 40px var(--team-b-glow); }
      100% { transform: scale(1); }
    }

    /* Floating particles */
    .particle-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      font-size: 17px;
      font-weight: 900;
      pointer-events: none;
      animation: floatParticle 1.5s forwards cubic-bezier(0.25, 1, 0.5, 1);
      text-shadow: 0 0 12px currentColor;
    }
    .particle.team-a { color: var(--team-a); }
    .particle.team-b { color: var(--team-b); }

    @keyframes floatParticle {
      0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
      50% { opacity: 1; transform: translate(var(--tx), -45px) scale(1.1); }
      100% { opacity: 0; transform: translate(calc(var(--tx) * 1.3), -95px) scale(0.7); }
    }

    /* Mobile Responsive */
    @media (max-width: 680px) {
      .battle-overlay { width: 95%; top: 12px; gap: 8px; }
      .battle-arena { padding: 10px 12px; }
      .team-name { font-size: 13px; max-width: 120px; }
      .team-avatar, .team-avatar-placeholder { width: 34px; height: 34px; font-size: 15px; }
      .battle-bar { height: 22px; }
      .vs-badge { font-size: 11px; padding: 2px 8px; }
      .leaderboards-row { grid-template-columns: 1fr 1fr; gap: 8px; }
      .lb-item { padding: 3px 6px; }
      .lb-name { font-size: 11px; }
    }
  </style>
</head>
<body>

  <!-- Floating Particles Layer -->
  <div id="particleLayer" class="particle-layer"></div>

  <!-- Main Battle Overlay Container -->
  <div class="battle-overlay">

    <!-- Header / Title -->
    <div id="battleHeader" class="battle-header">
      <span class="vs-icon">⚔️</span>
      <span id="arenaTitle" class="header-text">Battle Arena</span>
      <span class="vs-icon">⚔️</span>
    </div>

    <!-- Main Arena (A vs B Bar & Scores) -->
    <div id="battleArena" class="battle-arena">

      <!-- Team A -->
      <div class="team-card team-a">
        <div class="team-header">
          <div id="teamAAvatarWrap">
            <div class="team-avatar-placeholder">🅰️</div>
          </div>
          <div class="team-info">
            <span id="teamAName" class="team-name">Team A</span>
            <span class="team-score">
              <img src="/images/tiktok-coin.png" class="coin-icon" alt="" onerror="this.style.display='none'" />
              <span id="teamAScore">0</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Team B -->
      <div class="team-card team-b">
        <div class="team-header">
          <div id="teamBAvatarWrap">
            <div class="team-avatar-placeholder">🅱️</div>
          </div>
          <div class="team-info">
            <span id="teamBName" class="team-name">Team B</span>
            <span class="team-score">
              <img src="/images/tiktok-coin.png" class="coin-icon" alt="" onerror="this.style.display='none'" />
              <span id="teamBScore">0</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Combined Progress Bar A vs B -->
      <div id="combinedBarWrap" class="battle-bar-wrap">
        <div class="battle-bar">
          <div id="fillA" class="battle-fill-a" style="width: 50%;"></div>
          <div id="fillB" class="battle-fill-b" style="width: 50%;"></div>
          <div class="vs-badge">VS</div>
        </div>
      </div>

      <!-- Split Progress Bars (Separate) -->
      <div id="splitBarWrap" class="battle-split-bars-wrap" style="display: none;">
        <div class="battle-split-row">
          <div class="battle-split-head">
            <span id="splitLabelA" style="color: var(--team-a); font-weight: 800;">Team A</span>
            <span id="splitPctA" style="color: #fff; font-size: 11px;">50%</span>
          </div>
          <div class="battle-split-track">
            <div id="splitFillA" class="battle-split-fill-a" style="width: 50%;"></div>
          </div>
        </div>
        <div class="battle-split-row">
          <div class="battle-split-head">
            <span id="splitLabelB" style="color: var(--team-b); font-weight: 800;">Team B</span>
            <span id="splitPctB" style="color: #fff; font-size: 11px;">50%</span>
          </div>
          <div class="battle-split-track">
            <div id="splitFillB" class="battle-split-fill-b" style="width: 50%;"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Leaderboards Row (A & B) -->
    <div class="leaderboards-row">

      <!-- Leaderboard A -->
      <div id="leaderboardA" class="leaderboard leaderboard-a">
        <div class="lb-header">
          <span id="lbTitleA" class="lb-title">🏆 Team A</span>
          <span id="lbCountA" class="lb-count">0</span>
        </div>
        <ul id="lbListA" class="lb-list">
          <li class="lb-empty">Belum ada data</li>
        </ul>
      </div>

      <!-- Leaderboard B -->
      <div id="leaderboardB" class="leaderboard leaderboard-b">
        <div class="lb-header">
          <span id="lbTitleB" class="lb-title">🏆 Team B</span>
          <span id="lbCountB" class="lb-count">0</span>
        </div>
        <ul id="lbListB" class="lb-list">
          <li class="lb-empty">Belum ada data</li>
        </ul>
      </div>

    </div>

  </div>

  <script>
    /* ============================================================
       NUREARN — BATTLE ARENA OVERLAY ENGINE
       ============================================================ */

    // URL Query Parameters Configuration
    const urlParams = new URLSearchParams(window.location.search);
    const viewParam = (urlParams.get('view') || 'all').toLowerCase();
    const modeParam = (urlParams.get('mode') || '').toLowerCase();
    const bgParam = (urlParams.get('bg') || '').toLowerCase();
    const barParam = (urlParams.get('bar') || '').toLowerCase();
    const barTypeParam = (urlParams.get('barType') || (urlParams.get('split') === '1' ? 'split' : '')).toLowerCase();
    const battleModeParam = (urlParams.get('battleMode') || '').toLowerCase();
    const targetParam = parseInt(urlParams.get('target'), 10) || 0;
    const glassParam = urlParams.get('glass') === '1' || urlParams.get('glass') === 'true';
    const gainAnimParam = urlParams.get('gainAnim') === '1' || urlParams.get('gainAnim') === 'true';

    // Apply URL classes to body
    if (viewParam) document.body.classList.add(`view-${viewParam}`);
    if (modeParam === 'pc') document.body.classList.add('mode-pc');
    if (bgParam) document.body.classList.add(`bg-${bgParam}`);
    if (barParam) document.body.classList.add(`bar-${barParam}`);
    if (glassParam) document.body.classList.add('has-glass');

    // Default Battle Configuration
    let battleConfig = {
      title: 'Battle Arena',
      mode: 'points',
      targetScore: 100,
      barType: 'combined',
      glassEffect: false,
      gainAnimation: true,
      teamA: { name: 'Team A', color: '#FFD700', giftIds: [], giftKeyword: '' },
      teamB: { name: 'Team B', color: '#FF3B3B', giftIds: [], giftKeyword: '' },
      generalGiftStrategy: 'auto',
      pointMultiplier: 1,
      showFlameOnTop1: true,
      pcMode: false,
      backgroundStyle: 'dark',
      barStyle: 'gradient',
      maxLeaderboard: 10,
      likeToPoints: false,
      likeRatio: 100
    };

    // State
    let teamAScore = 0;
    let teamBScore = 0;
    let teamAMembers = {};
    let teamBMembers = {};
    const previousRanksA = new Map();
    const previousRanksB = new Map();

    // DOM Elements
    const arenaTitleEl = document.getElementById('arenaTitle');
    const teamANameEl = document.getElementById('teamAName');
    const teamBNameEl = document.getElementById('teamBName');
    const teamAScoreEl = document.getElementById('teamAScore');
    const teamBScoreEl = document.getElementById('teamBScore');
    const fillA = document.getElementById('fillA');
    const fillB = document.getElementById('fillB');
    const combinedBarWrap = document.getElementById('combinedBarWrap');
    const splitBarWrap = document.getElementById('splitBarWrap');
    const splitFillA = document.getElementById('splitFillA');
    const splitFillB = document.getElementById('splitFillB');
    const splitPctA = document.getElementById('splitPctA');
    const splitPctB = document.getElementById('splitPctB');
    const splitLabelA = document.getElementById('splitLabelA');
    const splitLabelB = document.getElementById('splitLabelB');
    const battleArena = document.getElementById('battleArena');
    const lbListA = document.getElementById('lbListA');
    const lbListB = document.getElementById('lbListB');
    const lbCountA = document.getElementById('lbCountA');
    const lbCountB = document.getElementById('lbCountB');
    const lbTitleA = document.getElementById('lbTitleA');
    const lbTitleB = document.getElementById('lbTitleB');
    const particleLayer = document.getElementById('particleLayer');

    function esc(str) {
      if (str === undefined || str === null) return '';
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function getMemberKey(payload) {
      if (!payload) return `user_${Date.now()}`;
      if (payload.uniqueId && payload.uniqueId !== 'unknown' && payload.uniqueId !== 'anon') return String(payload.uniqueId);
      if (payload.userId && payload.userId !== 'unknown') return String(payload.userId);
      if (payload.secUid && payload.secUid !== 'unknown') return String(payload.secUid);
      if (payload.nickname && payload.nickname !== 'unknown' && payload.nickname !== 'Penonton') {
        return String(payload.nickname).trim().replace(/[^a-zA-Z0-9_\u00C0-\u024F\u1E00-\u1EFF]/g, '_');
      }
      return `user_${Date.now()}`;
    }

    function matchKeyword(kwStr, giftName) {
      if (!kwStr || !giftName) return false;
      const terms = String(kwStr).split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      if (terms.length === 0) return false;
      const name = String(giftName).toLowerCase().trim();
      return terms.some(t => name.includes(t) || t.includes(name));
    }

    // Determine which team a gift belongs to
    function getGiftTeam(payload) {
      if (!payload) return null;
      const giftId = Number(payload.giftId || payload.gift?.id || 0);
      const giftName = String(payload.giftName || payload.gift?.name || '').toLowerCase().trim();

      const idsA = Array.isArray(battleConfig.teamA?.giftIds) ? battleConfig.teamA.giftIds.map(Number) : [];
      const idsB = Array.isArray(battleConfig.teamB?.giftIds) ? battleConfig.teamB.giftIds.map(Number) : [];
      const kwA = (battleConfig.teamA?.giftKeyword || '').trim();
      const kwB = (battleConfig.teamB?.giftKeyword || '').trim();

      // Check explicit Team A match (by ID or comma-separated keywords)
      const matchA = (idsA.length > 0 && idsA.includes(giftId)) || matchKeyword(kwA, giftName);
      // Check explicit Team B match (by ID or comma-separated keywords)
      const matchB = (idsB.length > 0 && idsB.includes(giftId)) || matchKeyword(kwB, giftName);

      if (matchA && !matchB) return 'A';
      if (matchB && !matchA) return 'B';
      if (matchA && matchB) {
        return teamAScore <= teamBScore ? 'A' : 'B';
      }

      // If either team has configured gifts or keywords, ONLY matching gifts are accepted!
      // Any unselected/random gift is strictly ignored and will NOT enter the leaderboard or battle.
      if (idsA.length > 0 || idsB.length > 0 || kwA !== '' || kwB !== '') {
        return null;
      }

      // Fallback only when absolutely no gift IDs and no keywords are configured:
      const strategy = battleConfig.generalGiftStrategy;
      if (strategy === 'teamA') return 'A';
      if (strategy === 'teamB') return 'B';
      if (strategy === 'balance') return teamAScore <= teamBScore ? 'A' : 'B';

      return null;
    }

    // Handle Gift Event
    function handleGift(payload) {
      if (!payload) return;
      const team = getGiftTeam(payload);
      if (!team) return; // Ignore gifts not in either team's list!

      const diamondCost = Number(payload.diamondCost || payload.diamond || 1);
      const repeat = Number(payload.repeatCount || payload.combo || 1);
      const mult = Number(battleConfig.pointMultiplier || 1);
      const points = Math.max(1, Math.round(diamondCost * repeat * mult));

      const key = getMemberKey(payload);
      const nickname = payload.nickname || payload.uniqueId || key;
      const avatar = payload.avatar || payload.profilePictureUrl || (payload.profilePictureUrl?.urlList && payload.profilePictureUrl.urlList[0]) || null;

      if (team === 'A') {
        teamAScore += points;
        // Strictly prevent cross-team duplication: remove user from Team B
        if (teamBMembers && teamBMembers[key]) {
          delete teamBMembers[key];
        }
        if (!teamAMembers[key]) {
          teamAMembers[key] = {
            nickname: nickname,
            avatar: avatar,
            score: 0
          };
        }
        if (avatar) teamAMembers[key].avatar = avatar;
        if (nickname) teamAMembers[key].nickname = nickname;
        teamAMembers[key].score += points;

        pulseTeam('A');
        spawnParticle('A', points);
      } else if (team === 'B') {
        teamBScore += points;
        // Strictly prevent cross-team duplication: remove user from Team A
        if (teamAMembers && teamAMembers[key]) {
          delete teamAMembers[key];
        }
        if (!teamBMembers[key]) {
          teamBMembers[key] = {
            nickname: nickname,
            avatar: avatar,
            score: 0
          };
        }
        if (avatar) teamBMembers[key].avatar = avatar;
        if (nickname) teamBMembers[key].nickname = nickname;
        teamBMembers[key].score += points;

        pulseTeam('B');
        spawnParticle('B', points);
      }

      renderBattle();
    }

    // Handle Like Event
    function handleLike(payload) {
      if (!battleConfig.likeToPoints) return;
      const ratio = Number(battleConfig.likeRatio || 100);
      const count = Number(payload.likeCount || payload.totalLikes || 1);
      const points = Math.max(1, Math.floor(count / ratio));
      if (points <= 0) return;

      const key = getMemberKey(payload);

      // Attribute score to the team the user already supports, or general balance
      let team = null;
      if (teamAMembers[key] && !teamBMembers[key]) {
        team = 'A';
      } else if (teamBMembers[key] && !teamAMembers[key]) {
        team = 'B';
      } else {
        team = teamAScore <= teamBScore ? 'A' : 'B';
      }

      if (team === 'A') {
        teamAScore += points;
      } else {
        teamBScore += points;
      }
      // Likes only affect bar score, they do NOT pollute the gifter leaderboard
      renderBattle();
    }

    // Render Battle Bar & Scores
    function renderBattle() {
      const isSplit = (barTypeParam === 'split') || (battleConfig.barType === 'split');
      const isMatch = (battleModeParam === 'match') || (battleConfig.mode === 'match');
      const targetScore = targetParam || battleConfig.targetScore || 100;

      if (combinedBarWrap && splitBarWrap) {
        if (isSplit) {
          combinedBarWrap.style.display = 'none';
          splitBarWrap.style.display = 'flex';
        } else {
          combinedBarWrap.style.display = 'block';
          splitBarWrap.style.display = 'none';
        }
      }

      // Format Scores
      if (teamAScoreEl) {
        teamAScoreEl.textContent = isMatch ? `${teamAScore.toLocaleString()} / ${targetScore.toLocaleString()}` : teamAScore.toLocaleString();
      }
      if (teamBScoreEl) {
        teamBScoreEl.textContent = isMatch ? `${teamBScore.toLocaleString()} / ${targetScore.toLocaleString()}` : teamBScore.toLocaleString();
      }

      if (isMatch) {
        // Match / Goal race percentages
        const pctA = Math.min(100, Math.round((teamAScore / targetScore) * 100));
        const pctB = Math.min(100, Math.round((teamBScore / targetScore) * 100));

        if (fillA) fillA.style.width = `${Math.min(95, Math.max(5, (teamAScore / (teamAScore + teamBScore || 1)) * 100))}%`;
        if (fillB) fillB.style.width = `${Math.min(95, Math.max(5, (teamBScore / (teamAScore + teamBScore || 1)) * 100))}%`;

        if (splitFillA) splitFillA.style.width = `${pctA}%`;
        if (splitFillB) splitFillB.style.width = `${pctB}%`;
        if (splitPctA) splitPctA.textContent = `${pctA}%`;
        if (splitPctB) splitPctB.textContent = `${pctB}%`;
      } else {
        // Point accumulation mode
        const total = teamAScore + teamBScore;
        let percentA = 50;
        let percentB = 50;

        if (total > 0) {
          percentA = Math.min(96, Math.max(4, (teamAScore / total) * 100));
          percentB = 100 - percentA;
        }

        if (fillA) fillA.style.width = `${percentA}%`;
        if (fillB) fillB.style.width = `${percentB}%`;

        if (splitFillA) splitFillA.style.width = `${percentA}%`;
        if (splitFillB) splitFillB.style.width = `${percentB}%`;
        if (splitPctA) splitPctA.textContent = `${Math.round(percentA)}%`;
        if (splitPctB) splitPctB.textContent = `${Math.round(percentB)}%`;
      }

      // Cross-team deduplication safeguard: ensure no user key is ever duplicated across Team A and Team B
      if (teamAMembers && teamBMembers) {
        for (const k in teamAMembers) {
          if (teamBMembers[k]) {
            if ((teamAMembers[k].score || 0) >= (teamBMembers[k].score || 0)) {
              delete teamBMembers[k];
            } else {
              delete teamAMembers[k];
            }
          }
        }
      }

      renderLeaderboard('A');
      renderLeaderboard('B');
    }

    // Render Leaderboard
    function renderLeaderboard(team) {
      const members = team === 'A' ? teamAMembers : teamBMembers;
      const listEl = team === 'A' ? lbListA : lbListB;
      const countEl = team === 'A' ? lbCountA : lbCountB;
      const prevRanks = team === 'A' ? previousRanksA : previousRanksB;
      const maxEntries = Number(battleConfig.maxLeaderboard || 10);
      const showFlame = battleConfig.showFlameOnTop1 !== false;

      if (!listEl) return;

      const sorted = Object.entries(members)
        .map(([key, m]) => ({ key, ...m }))
        .sort((a, b) => b.score - a.score)
        .slice(0, maxEntries);

      if (countEl) countEl.textContent = Object.keys(members).length;

      if (sorted.length === 0) {
        listEl.innerHTML = '<li class="lb-empty">Belum ada data</li>';
        return;
      }

      const html = [];
      for (let idx = 0; idx < sorted.length; idx++) {
        const m = sorted[idx];
        const rank = idx + 1;
        const prevRank = prevRanks.get(m.key);
        const didOvertake = prevRank !== undefined && rank < prevRank;
        prevRanks.set(m.key, rank);

        const avatarHtml = m.avatar
          ? `<img class="lb-avatar" src="${esc(m.avatar)}" onerror="this.outerHTML='<div class=\\'lb-avatar-placeholder\\'>🎁</div>';" alt="" />`
          : `<div class="lb-avatar-placeholder">🎁</div>`;

        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
        const overtakeClass = didOvertake ? ` overtake-${team.toLowerCase()}` : '';
        const flameClass = (rank === 1 && showFlame) ? ' has-flame' : '';

        html.push(`
          <li class="lb-item rank-${rank}${overtakeClass}${flameClass}">
            <span class="lb-rank">${medal}</span>
            ${avatarHtml}
            <div class="lb-info">
              <span class="lb-name">${esc(m.nickname)}</span>
              <span class="lb-value">
                <img src="/images/tiktok-coin.png" class="coin-icon" alt="" onerror="this.style.display='none'" />
                ${Number(m.score || 0).toLocaleString()}
              </span>
            </div>
          </li>
        `);
      }

      listEl.innerHTML = html.join('');
    }

    // Pulse Animation on Point Score
    function pulseTeam(team) {
      if (!battleArena) return;
      battleArena.classList.remove('pulse-a', 'pulse-b', 'gain-sparkle-active');
      void battleArena.offsetWidth;
      battleArena.classList.add(team === 'A' ? 'pulse-a' : 'pulse-b');
      if (battleConfig.gainAnimation !== false || gainAnimParam) {
        battleArena.classList.add('gain-sparkle-active');
      }
      setTimeout(() => {
        battleArena.classList.remove('pulse-a', 'pulse-b', 'gain-sparkle-active');
      }, 600);
    }

    // Spawn Floating Points
    function spawnParticle(team, amount) {
      if (!particleLayer) return;
      const el = document.createElement('div');
      el.className = `particle team-${team.toLowerCase()}`;
      el.textContent = `+${amount.toLocaleString()}`;

      const baseLeft = team === 'A' ? 24 : 76;
      el.style.left = `${baseLeft + (Math.random() * 8 - 4)}%`;
      el.style.top = '35%';

      const tx = `${(Math.random() - 0.5) * 60}px`;
      el.style.setProperty('--tx', tx);

      particleLayer.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }

    // Apply Live Config Updates
    function applyConfig(cfg) {
      if (!cfg) return;
      battleConfig = {
        ...battleConfig,
        ...cfg,
        teamA: { ...battleConfig.teamA, ...(cfg.teamA || {}) },
        teamB: { ...battleConfig.teamB, ...(cfg.teamB || {}) }
      };

      if (arenaTitleEl && cfg.title) arenaTitleEl.textContent = cfg.title;
      if (teamANameEl && cfg.teamA?.name) {
        teamANameEl.textContent = cfg.teamA.name;
        if (splitLabelA) splitLabelA.textContent = cfg.teamA.name;
      }
      if (teamBNameEl && cfg.teamB?.name) {
        teamBNameEl.textContent = cfg.teamB.name;
        if (splitLabelB) splitLabelB.textContent = cfg.teamB.name;
      }
      if (lbTitleA && cfg.teamA?.name) lbTitleA.textContent = `🏆 ${cfg.teamA.name}`;
      if (lbTitleB && cfg.teamB?.name) lbTitleB.textContent = `🏆 ${cfg.teamB.name}`;

      if (cfg.teamA?.color) {
        document.documentElement.style.setProperty('--team-a', cfg.teamA.color);
      }
      if (cfg.teamB?.color) {
        document.documentElement.style.setProperty('--team-b', cfg.teamB.color);
      }

      if (cfg.pcMode && !document.body.classList.contains('mode-pc')) {
        document.body.classList.add('mode-pc');
      } else if (cfg.pcMode === false && modeParam !== 'pc') {
        document.body.classList.remove('mode-pc');
      }

      if (cfg.backgroundStyle && !bgParam) {
        document.body.classList.remove('bg-transparent', 'bg-cyber', 'bg-solid');
        if (cfg.backgroundStyle !== 'dark') document.body.classList.add(`bg-${cfg.backgroundStyle}`);
      }

      if (cfg.barStyle && !barParam) {
        document.body.classList.remove('bar-liquid', 'bar-neon', 'bar-crystal');
        if (cfg.barStyle !== 'gradient') document.body.classList.add(`bar-${cfg.barStyle}`);
      }

      if (cfg.glassEffect || glassParam) {
        document.body.classList.add('has-glass');
      } else {
        document.body.classList.remove('has-glass');
      }

      if (cfg.scores) {
        teamAScore = cfg.scores.teamA || 0;
        teamBScore = cfg.scores.teamB || 0;
        teamAMembers = cfg.scores.membersA ? { ...cfg.scores.membersA } : {};
        teamBMembers = cfg.scores.membersB ? { ...cfg.scores.membersB } : {};
      }

      renderBattle();
    }

    // Reset Battle
    function resetBattle() {
      teamAScore = 0;
      teamBScore = 0;
      teamAMembers = {};
      teamBMembers = {};
      previousRanksA.clear();
      previousRanksB.clear();
      renderBattle();
    }

    // Fetch Initial Config via HTTP
    async function loadInitialConfig() {
      try {
        const res = await fetch('/api/battle');
        if (res.ok) {
          const cfg = await res.json();
          applyConfig(cfg);
          if (cfg.scores) {
            teamAScore = cfg.scores.teamA || 0;
            teamBScore = cfg.scores.teamB || 0;
            teamAMembers = cfg.scores.membersA || {};
            teamBMembers = cfg.scores.membersB || {};
            renderBattle();
          }
        }
      } catch (_) {}
    }

    // WebSocket Connection
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const battleUrlParams = new URLSearchParams(window.location.search);
    const battlePathParts = window.location.pathname.replace(/^\/overlay\/?/, '').split('/').filter(Boolean);
    let battlePathUser = (battlePathParts.length >= 2 && battlePathParts[1].toLowerCase() === 'battle') ? battlePathParts[0] : '';
    const battleUser = (battleUrlParams.get('username') || battleUrlParams.get('user') || battlePathUser || '').toLowerCase().trim().replace(/^@/, '');
    const wsUrl = `${wsProtocol}//${window.location.host}${battleUser ? '?username=' + encodeURIComponent(battleUser) : ''}`;
    let ws;

    function connect() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('[Battle Overlay] ✅ Connected');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const { type, payload } = data;

          if (type === 'event:gift') {
            handleGift(payload);
          } else if (type === 'event:like') {
            handleLike(payload);
          } else if (type === 'battle:config') {
            applyConfig(payload);
          } else if (type === 'battle:reset') {
            resetBattle();
          } else if (type === 'battle:score') {
            if (payload.team === 'A') {
              teamAScore += payload.amount || 0;
              pulseTeam('A');
              spawnParticle('A', payload.amount || 0);
            } else if (payload.team === 'B') {
              teamBScore += payload.amount || 0;
              pulseTeam('B');
              spawnParticle('B', payload.amount || 0);
            }
            renderBattle();
          }
        } catch (err) {
          console.error('[Battle Overlay] Parse error:', err);
        }
      };

      ws.onclose = () => {
        setTimeout(connect, 3000);
      };

      ws.onerror = (err) => console.error('[Battle Overlay] Error:', err);
    }

    // Init
    loadInitialConfig();
    renderBattle();
    connect();
  </script>
</body>
</html>
