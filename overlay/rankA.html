<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Overlay Top Rank A</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      padding: 16px;
      user-select: none;
    }

    .rank-board {
      width: 340px;
      background: linear-gradient(135deg, rgba(20, 24, 38, 0.92) 0%, rgba(12, 14, 24, 0.96) 100%);
      border: 1.5px solid rgba(251, 191, 36, 0.5);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), 0 0 25px rgba(251, 191, 36, 0.25);
      backdrop-filter: blur(12px);
      padding: 16px 14px;
      animation: boardFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes boardFadeIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .board-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(251, 191, 36, 0.25);
      position: relative;
    }

    .header-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .board-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fef08a, #f59e0b, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
      text-transform: uppercase;
    }

    .rank-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .rank-item.top-1 {
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.22) 0%, rgba(217, 119, 6, 0.12) 100%);
      border: 1.5px solid rgba(251, 191, 36, 0.7);
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.25);
    }

    .rank-item.top-2 {
      background: linear-gradient(90deg, rgba(148, 163, 184, 0.18) 0%, rgba(71, 85, 105, 0.1) 100%);
      border: 1px solid rgba(203, 213, 225, 0.5);
    }

    .rank-item.top-3 {
      background: linear-gradient(90deg, rgba(217, 119, 6, 0.18) 0%, rgba(180, 83, 9, 0.08) 100%);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .rank-item.overtake-anim {
      animation: overtakeGlow 0.8s ease-out;
    }

    @keyframes overtakeGlow {
      0% { transform: scale(1.04); box-shadow: 0 0 25px #fbbf24; }
      100% { transform: scale(1); }
    }

    .rank-pos {
      width: 24px;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      flex-shrink: 0;
    }

    .top-1 .rank-pos { color: #fde047; font-size: 17px; }
    .top-2 .rank-pos { color: #e2e8f0; }
    .top-3 .rank-pos { color: #f59e0b; }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }

    .top-1 .user-avatar { border-color: #fde047; box-shadow: 0 0 8px rgba(253, 224, 71, 0.6); }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .user-score-box {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 9px;
      border-radius: 20px;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .coin-icon {
      width: 15px;
      height: 15px;
      object-fit: contain;
    }

    .user-coins {
      font-size: 13.5px;
      font-weight: 900;
      color: #fde047;
      font-family: 'Inter', sans-serif;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: #94a3b8;
      font-size: 13px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="rank-board">
    <div class="board-header">
      <span class="header-badge">RANK A</span>
      <h1 class="board-title">👑 TOP RANK A</h1>
    </div>
    <ul class="rank-list" id="rankList">
      <li class="empty-state">Menunggu pengirim gift...</li>
    </ul>
  </div>

  <script>
    const rankListEl = document.getElementById('rankList');
    const prevPositions = new Map();

    function renderRankList(items) {
      if (!items || items.length === 0) {
        rankListEl.innerHTML = '<li class="empty-state">Menunggu pengirim gift...</li>';
        prevPositions.clear();
        return;
      }

      const defaultAvatar = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="%2364748b"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
      let html = '';

      items.slice(0, 10).forEach((user, idx) => {
        const rank = idx + 1;
        const key = user.uniqueId || user.name || `idx_${idx}`;
        const prevRank = prevPositions.get(key);
        const didOvertake = prevRank !== undefined && rank < prevRank;
        prevPositions.set(key, rank);

        const rankClass = rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : '';
        const animClass = didOvertake ? 'overtake-anim' : '';
        const avatar = user.avatar || defaultAvatar;
        const score = (Number(user.score) || 0).toLocaleString();

        html += `
          <li class="rank-item ${rankClass} ${animClass}">
            <span class="rank-pos">${rank}</span>
            <img class="user-avatar" src="${avatar}" alt="Avatar" onerror="this.src='${defaultAvatar}'" />
            <div class="user-info">
              <span class="user-name" title="${user.name}">${user.name}</span>
            </div>
            <div class="user-score-box">
              <img class="coin-icon" src="/images/tiktok-coin.png" onerror="this.style.display='none'" />
              <span class="user-coins">${score}</span>
            </div>
          </li>
        `;
      });

      rankListEl.innerHTML = html;
    }

    // Connect via native WebSocket
    function initWebSocket() {
      const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsHost = location.host || 'localhost:8642';
      const ws = new WebSocket(`${wsProto}//${wsHost}`);

      ws.addEventListener('open', () => {
        console.log('[Rank A Overlay] Connected to WebSocket');
      });

      ws.addEventListener('message', (evt) => {
        try {
          const data = JSON.parse(evt.data);
          if (data.type === 'rank:update') {
            if (data.payload && data.payload.rankA) {
              renderRankList(data.payload.rankA);
            }
          } else if (data.type === 'event:stats') {
            if (data.payload && data.payload.customRankA) {
              const list = Object.values(data.payload.customRankA)
                .sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));
              renderRankList(list);
            }
          }
        } catch (err) {
          console.error('Error handling WS message:', err);
        }
      });

      ws.addEventListener('close', () => {
        setTimeout(initWebSocket, 2000);
      });

      ws.addEventListener('error', (err) => {
        console.warn('WS error:', err);
      });
    }

    // Initial load via API
    fetch('/api/ranka')
      .then(r => r.json())
      .then(list => {
        if (Array.isArray(list) && list.length > 0) {
          renderRankList(list);
        }
      })
      .catch(() => {});

    initWebSocket();
  </script>
</body>
</html>
